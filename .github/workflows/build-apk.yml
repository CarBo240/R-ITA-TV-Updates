
name: Compila APK Universale R. ITA TV

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installa Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Prepara chiave di firma
        env:
          RITA_KEYSTORE_BASE64: ${{ secrets.RITA_KEYSTORE_BASE64 }}
        run: |
          test -n "$RITA_KEYSTORE_BASE64"
          printf '%s' "$RITA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rita-signing.p12"
          test -s "$RUNNER_TEMP/rita-signing.p12"

      - name: Compila APK universale firmato
        env:
          RITA_KEYSTORE_FILE: ${{ runner.temp }}/rita-signing.p12
          RITA_KEYSTORE_PASSWORD: ${{ secrets.RITA_KEYSTORE_PASSWORD }}
          RITA_KEY_ALIAS: player
          RITA_KEY_PASSWORD: ${{ secrets.RITA_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Verifica APK universale
        run: |
          APK="build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRORE: APK universale non trovato"
            exit 1
          fi

          echo "APK universale generato correttamente"
          ls -lh "$APK"

          mkdir -p final-apk
          cp "$APK" final-apk/R-ITA-TV-v1.31-universal.apk

          echo "## R. ITA TV 1.31" >> "$GITHUB_STEP_SUMMARY"
          echo "APK universale compilato e firmato." >> "$GITHUB_STEP_SUMMARY"

      - name: Salva unico APK universale
        uses: actions/upload-artifact@v4
        with:
          name: R-ITA-TV-v1.31-universal
          path: final-apk/R-ITA-TV-v1.31-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Esegui test Android
        id: android_tests
        continue-on-error: true
        run: |
          gradle --no-daemon testDebugUnitTest

      - name: Verifica filtri e fullscreen
        id: filter_tests
        continue-on-error: true
        run: |
          node tests/adblock.test.cjs
          node tests/adblock-content.test.cjs
          node tests/fullscreen.test.cjs

      - name: Riepilogo test
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Risultati test" >> "$GITHUB_STEP_SUMMARY"
          echo "Android: ${{ steps.android_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Filtri e fullscreen: ${{ steps.filter_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verificare i test falliti prima della distribuzione." >> "$GITHUB_STEP_SUMMARY"
