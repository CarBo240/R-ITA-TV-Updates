name: Compila APK R. ITA TV

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sorgenti
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Recupera chiave dai Secrets
        env:
          RITA_KEYSTORE_BASE64: ${{ secrets.RITA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RITA_KEYSTORE_BASE64"
          printf '%s' "$RITA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rita-signing.p12"
          test -s "$RUNNER_TEMP/rita-signing.p12"
      - name: Verifica link player web
        run: bash scripts/check-web-movies.sh
      - name: Compila tre APK
        env:
          RITA_KEYSTORE_FILE: ${{ runner.temp }}/rita-signing.p12
          RITA_KEYSTORE_PASSWORD: ${{ secrets.RITA_KEYSTORE_PASSWORD }}
          RITA_KEY_ALIAS: player
          RITA_KEY_PASSWORD: ${{ secrets.RITA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Controlla APK universale e firma
        run: |
          set -euo pipefail
          find build/outputs/apk/debug -type f -name '*.apk' -print
          mapfile -t APKS < <(find build/outputs/apk/debug -name '*universal*.apk' -type f)
          test "${#APKS[@]}" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "${APKS[0]}"
      - name: Artifacts con tre varianti
        uses: actions/upload-artifact@v4
        with:
          name: R-ITA-TV-v1.40-APK
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Test Android
        id: android_tests
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest
      - name: Test JavaScript
        id: js_tests
        continue-on-error: true
        run: |
          node tests/adblock.test.cjs
          node tests/adblock-content.test.cjs
          node tests/fullscreen.test.cjs
      - name: Riepilogo
        if: always()
        run: |
          echo "Test Android: ${{ steps.android_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Test JS: ${{ steps.js_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
