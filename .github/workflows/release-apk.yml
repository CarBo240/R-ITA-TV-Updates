name: Pubblica APK universale

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Installa SDK richiesto
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepara firma privata
        env:
          RITA_KEYSTORE_BASE64: ${{ secrets.RITA_KEYSTORE_BASE64 }}
        run: |
          test -n "$RITA_KEYSTORE_BASE64"
          printf '%s' "$RITA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rita-signing.p12"
      - name: Compila APK universale
        env:
          RITA_KEYSTORE_FILE: ${{ runner.temp }}/rita-signing.p12
          RITA_KEYSTORE_PASSWORD: ${{ secrets.RITA_KEYSTORE_PASSWORD }}
          RITA_KEY_ALIAS: player
          RITA_KEY_PASSWORD: ${{ secrets.RITA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Prepara nome release
        run: |
          apk="$(find build/outputs/apk -type f -name '*universal*debug*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "R-ITA-TV-${GITHUB_REF_NAME}-universal.apk"
      - name: Crea GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "R-ITA-TV-${GITHUB_REF_NAME}-universal.apk" --generate-notes --title "R. ITA TV ${GITHUB_REF_NAME}"
