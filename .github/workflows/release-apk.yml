
name: Pubblica APK universale R. ITA TV

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installa Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Prepara chiave di firma
        env:
          RITA_KEYSTORE_BASE64: ${{ secrets.RITA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$RITA_KEYSTORE_BASE64"

          printf '%s' "$RITA_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/rita-signing.p12"

          test -s "$RUNNER_TEMP/rita-signing.p12"

      - name: Compila i tre APK
        env:
          RITA_KEYSTORE_FILE: ${{ runner.temp }}/rita-signing.p12
          RITA_KEYSTORE_PASSWORD: ${{ secrets.RITA_KEYSTORE_PASSWORD }}
          RITA_KEY_ALIAS: player
          RITA_KEY_PASSWORD: ${{ secrets.RITA_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Seleziona solo APK universale
        shell: bash
        run: |
          set -euo pipefail

          echo "APK generati:"
          find build/outputs/apk/debug \
            -type f -name "*.apk" -print

          mapfile -t UNIVERSAL < <(
            find build/outputs/apk/debug \
              -type f -name "*universal*.apk" | sort
          )

          if [ "${#UNIVERSAL[@]}" -ne 1 ]; then
            echo "ERRORE: Atteso un solo APK universale."
            exit 1
          fi

          mkdir -p release-files

          cp "${UNIVERSAL[0]}" \
            release-files/R-ITA-TV-universal.apk

          echo "APK da pubblicare:"
          ls -lh release-files/

      - name: Verifica firma APK
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs \
            release-files/R-ITA-TV-universal.apk

      - name: Pubblica solo APK universale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-files/R-ITA-TV-universal.apk \
            --verify-tag \
            --title "R. ITA TV $GITHUB_REF_NAME" \
            --generate-notes \
            --latest

      - name: Riepilogo Release
        run: |
          echo "## R. ITA TV" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "APK pubblicati: 1 (universale)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK 32 e 64 bit separati: non pubblicati" >> "$GITHUB_STEP_SUMMARY"
