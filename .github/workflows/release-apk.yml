name: Pubblica solo APK universale

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sorgenti versione pubblicata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Recupera chiave
        env:
          RITA_KEYSTORE_BASE64: ${{ secrets.RITA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RITA_KEYSTORE_BASE64"
          printf '%s' "$RITA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rita-signing.p12"
      - name: Compila tre varianti
        env:
          RITA_KEYSTORE_FILE: ${{ runner.temp }}/rita-signing.p12
          RITA_KEYSTORE_PASSWORD: ${{ secrets.RITA_KEYSTORE_PASSWORD }}
          RITA_KEY_ALIAS: player
          RITA_KEY_PASSWORD: ${{ secrets.RITA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Seleziona solo universale e verifica firma
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find build/outputs/apk/debug -name '*universal*.apk' -type f)
          test "${#APKS[@]}" -eq 1
          mkdir -p release-files
          cp "${APKS[0]}" release-files/R-ITA-TV-universal.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release-files/R-ITA-TV-universal.apk
      - name: Allega solo APK universale alla Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-files/R-ITA-TV-universal.apk --clobber
