
name: Pubblica APK universale R. ITA TV

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installa Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Prepara chiave di firma
        env:
          RITA_KEYSTORE_BASE64: ${{ secrets.RITA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$RITA_KEYSTORE_BASE64"

          printf '%s' "$RITA_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/rita-signing.p12"

          test -s "$RUNNER_TEMP/rita-signing.p12"

      - name: Compila APK firmati
        env:
          RITA_KEYSTORE_FILE: ${{ runner.temp }}/rita-signing.p12
          RITA_KEYSTORE_PASSWORD: ${{ secrets.RITA_KEYSTORE_PASSWORD }}
          RITA_KEY_ALIAS: player
          RITA_KEY_PASSWORD: ${{ secrets.RITA_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Seleziona APK universale
        shell: bash
        run: |
          set -euo pipefail

          echo "Elenco APK generati:"
          find build/outputs/apk -name "*.apk" -print

          mapfile -t FILES < <(
            find build/outputs/apk/debug \
              -type f -iname "*universal*.apk" | sort
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "ERRORE: Atteso un APK universale."
            exit 1
          fi

          mkdir -p release-files

          cp "${FILES[0]}" \
            release-files/R-ITA-TV-universal.apk

          echo "APK selezionato:"
          ls -lh release-files/

      - name: Verifica firma APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs \
            release-files/R-ITA-TV-universal.apk

      - name: Allega APK alla Release esistente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-files/R-ITA-TV-universal.apk \
            --clobber

      - name: Riepilogo
        run: |
          echo "## Release R. ITA TV" >> "$GITHUB_STEP_SUMMARY"
          echo "Versione: ${{ github.event.release.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "APK pubblicato: R-ITA-TV-universal.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "APK pubblicati: 1" >> "$GITHUB_STEP_SUMMARY"
